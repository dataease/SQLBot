name: build-base-and-push

run-name: 构建镜像并推送仓库 ${{ github.event.inputs.dockerImageTag }} (${{ github.event.inputs.registry }}) (${{ github.event.inputs.architecture }})

on:
  workflow_dispatch:
    inputs:
      dockerImageTag:
        description: 'Image Tag'
        default: 'v0.9.0'
        required: true
      dockerImageTagWithLatest:
        description: '是否发布latest tag（正式发版时选择，测试版本切勿选择）'
        default: false
        required: true
        type: boolean
      architecture:
        description: 'Architecture'
        required: true
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
      registry:
        description: 'Push To Registry'
        required: true
        default: 'aliyun-registry'
        type: choice
        options:
          - aliyun-registry
          - dockerhub
          - dockerhub, aliyun-registry

jobs:
  build-and-push-to-aliyun-registry:
    if: ${{ contains(github.event.inputs.registry, 'aliyun') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Prepare
        id: prepare
        env:
          DOCKER_IMAGE: ${{ secrets.ALIYUN_REGISTRY_HOST }}/dataease/sqlbot-python-pg
          TAG_NAME: ${{ inputs.dockerImageTag }}
          TAG_NAME_WITH_LATEST: ${{ inputs.dockerImageTagWithLatest }}
        run: |
          tags="$DOCKER_IMAGE:$TAG_NAME"
          if [[ "$TAG_NAME_WITH_LATEST" == 'true' ]]; then
            tags="$tags,$DOCKER_IMAGE:${TAG_NAME%%.*},$DOCKER_IMAGE:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Aliyun Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY_HOST }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Docker Buildx (build-and-push)
        env:
          SQLBOT_BASE_TAGS: ${{ steps.prepare.outputs.tags }}
          SQLBOT_BASE_PLATFORMS: ${{ inputs.architecture }}
        run: |
          docker buildx bake -f docker-bake.hcl --pull --no-cache --provenance=false --sbom=false \
            --set 'base.output=type=image,push=true,oci-mediatypes=false' base

  build-and-push-to-dockerhub:
    if: ${{ contains(github.event.inputs.registry, 'dockerhub') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Prepare
        id: prepare
        env:
          DOCKER_IMAGE: dataease/sqlbot-python-pg
          TAG_NAME: ${{ inputs.dockerImageTag }}
          TAG_NAME_WITH_LATEST: ${{ inputs.dockerImageTagWithLatest }}
        run: |
          tags="$DOCKER_IMAGE:$TAG_NAME"
          if [[ "$TAG_NAME_WITH_LATEST" == 'true' ]]; then
            tags="$tags,$DOCKER_IMAGE:${TAG_NAME%%.*},$DOCKER_IMAGE:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Buildx (build-and-push)
        env:
          SQLBOT_BASE_TAGS: ${{ steps.prepare.outputs.tags }}
          SQLBOT_BASE_PLATFORMS: ${{ inputs.architecture }}
        run: |
          docker buildx bake -f docker-bake.hcl --pull --no-cache --provenance=false --sbom=false \
            --set 'base.output=type=image,push=true,oci-mediatypes=false' base
