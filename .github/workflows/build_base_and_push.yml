name: build-base-and-push

run-name: 构建镜像并推送仓库 ${{ github.event.inputs.dockerImageTag }} (${{ github.event.inputs.registry }}) (${{ github.event.inputs.architecture }})

on:
  workflow_dispatch:
    inputs:
      dockerImageTag:
        description: 'Base image version prefix (YYYYMMDD is appended automatically)'
        default: 'v0.9.0'
        required: true
      dockerImageTagWithLatest:
        description: 'Publish version, major-version and latest aliases (official releases only)'
        default: false
        required: true
        type: boolean
      architecture:
        description: 'Architecture'
        required: true
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
      registry:
        description: 'Push To Registry'
        required: true
        default: 'aliyun-registry'
        type: choice
        options:
          - aliyun-registry
          - dockerhub
          - dockerhub, aliyun-registry

jobs:
  prepare-tags:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Generate dated base image tag
        id: tag
        env:
          VERSION_TAG: ${{ inputs.dockerImageTag }}
        run: |
          image_tag="$VERSION_TAG-$(TZ=Asia/Shanghai date +'%Y%m%d')"
          printf 'image_tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"
          printf 'Base image tag: `%s`\n' "$image_tag" >> "$GITHUB_STEP_SUMMARY"

  build-and-push-to-aliyun-registry:
    needs: prepare-tags
    if: ${{ contains(github.event.inputs.registry, 'aliyun') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Prepare
        id: prepare
        env:
          DOCKER_IMAGE: ${{ secrets.ALIYUN_REGISTRY_HOST }}/dataease/sqlbot-python-pg
          TAG_NAME: ${{ inputs.dockerImageTag }}
          DATED_TAG: ${{ needs.prepare-tags.outputs.image_tag }}
          TAG_NAME_WITH_LATEST: ${{ inputs.dockerImageTagWithLatest }}
        run: |
          image_tags() {
            local image="$1"
            local tags="$image:$DATED_TAG"
            if [[ "$TAG_NAME_WITH_LATEST" == 'true' ]]; then
              tags="$tags,$image:$TAG_NAME,$image:${TAG_NAME%%.*},$image:latest"
            fi
            printf '%s' "$tags"
          }
          printf '%s=%s\n' \
            runtime_tags "$(image_tags "$DOCKER_IMAGE")" \
            build_tags "$(image_tags "${DOCKER_IMAGE%/*}/sqlbot-build-base")" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Aliyun Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY_HOST }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Docker Buildx (build-and-push)
        env:
          SQLBOT_BASE_TAGS: ${{ steps.prepare.outputs.runtime_tags }}
          SQLBOT_BUILD_TAGS: ${{ steps.prepare.outputs.build_tags }}
          SQLBOT_BASE_PLATFORMS: ${{ inputs.architecture }}
        run: |
          docker buildx bake -f docker-bake.hcl --pull --no-cache --provenance=false --sbom=false \
            --set 'base.output=type=image,push=true,oci-mediatypes=false' \
            --set 'build-base.output=type=image,push=true,oci-mediatypes=false' base build-base

  build-and-push-to-dockerhub:
    needs: prepare-tags
    if: ${{ contains(github.event.inputs.registry, 'dockerhub') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Prepare
        id: prepare
        env:
          DOCKER_IMAGE: dataease/sqlbot-python-pg
          TAG_NAME: ${{ inputs.dockerImageTag }}
          DATED_TAG: ${{ needs.prepare-tags.outputs.image_tag }}
          TAG_NAME_WITH_LATEST: ${{ inputs.dockerImageTagWithLatest }}
        run: |
          image_tags() {
            local image="$1"
            local tags="$image:$DATED_TAG"
            if [[ "$TAG_NAME_WITH_LATEST" == 'true' ]]; then
              tags="$tags,$image:$TAG_NAME,$image:${TAG_NAME%%.*},$image:latest"
            fi
            printf '%s' "$tags"
          }
          printf '%s=%s\n' \
            runtime_tags "$(image_tags "$DOCKER_IMAGE")" \
            build_tags "$(image_tags "${DOCKER_IMAGE%/*}/sqlbot-build-base")" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Buildx (build-and-push)
        env:
          SQLBOT_BASE_TAGS: ${{ steps.prepare.outputs.runtime_tags }}
          SQLBOT_BUILD_TAGS: ${{ steps.prepare.outputs.build_tags }}
          SQLBOT_BASE_PLATFORMS: ${{ inputs.architecture }}
        run: |
          docker buildx bake -f docker-bake.hcl --pull --no-cache --provenance=false --sbom=false \
            --set 'base.output=type=image,push=true,oci-mediatypes=false' \
            --set 'build-base.output=type=image,push=true,oci-mediatypes=false' base build-base
