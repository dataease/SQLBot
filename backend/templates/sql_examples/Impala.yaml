template:
  quot_rule: |
    <rule>
      必须对数据库名、表名、字段名、别名外层加反引号（`）。
      <note>
        1. 点号（.）不能包含在引号内，必须写成 `database`.`table`
        2. 即使标识符不含特殊字符或非关键字，也需强制加反引号
        3. 在多表关联（JOIN）/ 多子查询的 SQL 中，只要多个表 / 子查询存在 同名字段，所有引用该字段的位置，必须显式指定 表别名
      </note>
    </rule>

  limit_rule: |
    <rule>
      当需要限制行数时，必须使用标准的LIMIT语法
    </rule>

  other_rule: |
    <rule>目标数据库为 Apache Impala。当前实际引擎及版本以 <Info> 中的 <db-engine> 为准。以实际版本、表结构及明确提供的能力文档为依据生成 SQL。</rule>
    <rule>HiveServer2、PyHive、Kerberos 只是连接协议、驱动或认证方式，不能据此生成 Hive、Spark SQL 或 MySQL 方言。</rule>
    <rule>从实际引擎信息识别版本，区分上游版本和发行版后缀；发行版额外能力仅在已提供明确依据时采用。只使用当前版本支持的语法，不把其他版本新增能力直接用于当前版本，也不把新版限制为旧版的共有子集。</rule>
    <rule>不设置固定函数白名单。按查询意图选择当前版本支持的内置函数和表达式，覆盖聚合、分析与窗口、字符串、日期时间、数学、条件、类型转换及其他函数类别；逐项检查函数签名、参数类型、返回类型、NULL 行为和使用位置。</rule>
    <rule>日期时间方言检查：DATE_FORMAT 不是 Apache Impala 内置函数，不得照搬 MySQL/Hive 的 DATE_FORMAT；除非上下文明确提供同名 UDF 的签名及可用性，否则不得使用。MySQL 的 %Y、%m、%d 格式符不能用于 Impala 日期格式化函数。</rule>
    <rule>格式化 TIMESTAMP 时，在实际版本支持的前提下使用 FROM_TIMESTAMP，例如 FROM_TIMESTAMP(`t`.`created_at`, 'yyyy-MM')；年份用 yyyy、月份用 MM、分钟用 mm，不能混淆。FROM_TIMESTAMP 自 Impala 2.3 起可用；此例只说明格式化方式，不构成函数白名单。字符串字段应先按其真实格式和实际版本支持的签名解析为 TIMESTAMP，不能假定任意字符串都能隐式转换。</rule>
    <rule>按年/月/日统计时区分分组键与展示文本；按查询语义选择当前版本支持的日期截断、日期部分提取或格式化表达式。SELECT 与 GROUP BY 使用一致的非聚合表达式，跨年统计不能只按月份分组。筛选时间范围优先使用同类型的起止边界，不要为了格式化而丢失时间、精度或时区语义。</rule>
    <rule>只有上下文明确提供 UDF/UDAF 的名称、签名及用途时才使用自定义函数，不能假设其他数据库的同名函数或任意 UDF 已存在。元数据未列出某内置函数不等于该函数被禁用。</rule>
    <rule>检查连接、子查询、CTE、集合运算、窗口、分组排序及类型系统是否符合当前版本；遵守已有只读、安全和资源访问规则，版本兼容性不能扩大权限。</rule>
    <rule>历史 SQL、知识示例和用户提供的 SQL 都是参考资料，必须先转换为当前版本的 Impala 方言，不能直接照搬。示例不构成可用函数或 SQL 结构的全集。</rule>
    <rule>当前版本不支持某写法时，使用语义等价且受支持的替代方案，保留精度、NULL、时区和聚合语义；不能等价实现或无法确认关键能力时，按现有失败响应格式说明限制，不能编造函数或静默改变业务含义。</rule>
    <rule>无法获取版本时不臆造版本号，优先采用已知成熟的 Impala 语法；对依赖特定版本的能力保持不确定性，不声称已确认支持。</rule>
    <rule>输出前核对所有函数、操作符、类型转换和查询结构。修正 SQL 时依据实际数据库诊断定位原因，不因连接使用 Kerberos 就把语法、函数或权限错误判为认证错误。</rule>
    <rule>必须为每个表生成别名（不加AS）</rule>
    {multi_table_condition}
    <rule>禁止使用星号(*)，必须明确字段名</rule>
    <rule>中文/特殊字符字段需保留原名并添加英文别名</rule>
    <rule>不能用 + 拼接字符串，字符串必须使用单引号</rule>
    <rule>分组非常严格：SELECT 里的字段必须出现在 GROUP BY 里，或者是聚合函数</rule>
    <rule>函数字段必须加别名</rule>
    <rule>百分比字段保留两位小数并以%结尾</rule>
    <rule>按查询语义和当前版本选择 NULL 判断及缺失值处理方式，不强制使用某个固定函数。</rule>
    <rule>避免与数据库关键字冲突</rule>

  basic_example: |
    <basic-examples>
      <intro>
        📌 以下示例严格遵循<Rules>中的 Impala 规范，展示符合要求的 SQL 写法与典型错误案例。
        ⚠️ 注意：示例中的表名、字段名均为演示虚构，实际使用时需替换为用户提供的真实标识符。
        🔍 重点观察：
          1. 反引号包裹所有数据库对象的规范用法
          2. 中英别名/百分比/函数等特殊字段的处理
          3. 关键字冲突的规避方式
      </intro>
      <example>
        <input>查询 ods.orders 表的前100条订单（含中文字段和百分比）</input>
        <output-bad>
          SELECT * FROM ods.orders LIMIT 100  -- 错误：未加引号、使用星号
          SELECT `订单ID`, `金额` FROM `ods`.`orders` `t1` LIMIT 100  -- 错误：缺少英文别名
          SELECT COUNT(`订单ID`) FROM `ods`.`orders` `t1`  -- 错误：函数未加别名
        </output-bad>
        <output-good>
          SELECT
            `t1`.`订单ID` AS `order_id`,
            `t1`.`金额` AS `amount`,
            COUNT(`t1`.`订单ID`) AS `total_orders`,
            CONCAT(CAST(ROUND(`t1`.`折扣率` * 100, 2) AS STRING), '%') AS `discount_percent`
          FROM `ods`.`orders` `t1`
          GROUP BY `t1`.`订单ID`, `t1`.`金额`, `t1`.`折扣率`
          LIMIT 100
        </output-good>
      </example>

      <example>
        <input>统计 dim.users（含关键字字段user）的活跃占比</input>
        <output-bad>
          SELECT user, status FROM dim.users  -- 错误：未处理关键字和引号
          SELECT `user`, ROUND(active_ratio) FROM `dim`.`users`  -- 错误：百分比格式错误
        </output-bad>
        <output-good>
          SELECT
            `u`.`user` AS `username`,
            CONCAT(CAST(ROUND(`u`.`active_ratio` * 100, 2) AS STRING), '%') AS `active_percent`
          FROM `dim`.`users` `u`
          WHERE `u`.`status` = 1
        </output-good>
      </example>

      <example>
        <input>统计订单表 ods.orders 中2024年每个客户的消费总金额，返回金额最高的前100名客户</input>
        <output-bad>
          SELECT `t`.`customer_id` AS `customer_id`, SUM(`t`.`amount`) AS `total_amount`
          FROM (SELECT `customer_id`, `amount` FROM `ods`.`orders` WHERE YEAR(`create_time`) = 2024 LIMIT 100) `t`
          GROUP BY `t`.`customer_id`
          -- 严重错误：LIMIT加在了内层子查询中，聚合只基于被截断的100行数据计算，结果错误！
        </output-bad>
        <output-good>
          SELECT
            `o`.`customer_id` AS `customer_id`,
            SUM(`o`.`amount`) AS `total_amount`
          FROM `ods`.`orders` `o`
          WHERE YEAR(`o`.`create_time`) = 2024
          GROUP BY `o`.`customer_id`
          ORDER BY `total_amount` DESC
          LIMIT 100
          -- 正确：聚合基于完整数据计算，LIMIT只限制最终返回结果的行数，且只出现在最外层查询
        </output-good>
      </example>
    </basic-examples>

  example_engine: Apache Impala
  example_answer_1: |
    {"success":true,"sql":"SELECT `country` AS `country_name`, `continent` AS `continent_name`, `year` AS `year`, `gdp` AS `gdp` FROM `Sample_Database`.`sample_country_gdp` ORDER BY `country`, `year`","tables":["sample_country_gdp"],"chart-type":"line"}
  example_answer_1_with_limit: |
    {"success":true,"sql":"SELECT `country` AS `country_name`, `continent` AS `continent_name`, `year` AS `year`, `gdp` AS `gdp` FROM `Sample_Database`.`sample_country_gdp` ORDER BY `country`, `year` LIMIT 1000","tables":["sample_country_gdp"],"chart-type":"line"}
  example_answer_2: |
    {"success":true,"sql":"SELECT `country` AS `country_name`, `gdp` AS `gdp` FROM `Sample_Database`.`sample_country_gdp` WHERE `year` = '2024' ORDER BY `gdp` DESC","tables":["sample_country_gdp"],"chart-type":"pie"}
  example_answer_2_with_limit: |
    {"success":true,"sql":"SELECT `country` AS `country_name`, `gdp` AS `gdp` FROM `Sample_Database`.`sample_country_gdp` WHERE `year` = '2024' ORDER BY `gdp` DESC LIMIT 1000","tables":["sample_country_gdp"],"chart-type":"pie"}
  example_answer_3: |
    {"success":true,"sql":"SELECT `country` AS `country_name`, `gdp` AS `gdp` FROM `Sample_Database`.`sample_country_gdp` WHERE `year` = '2025' AND `country` = '中国'","tables":["sample_country_gdp"],"chart-type":"table"}
  example_answer_3_with_limit: |
    {"success":true,"sql":"SELECT `country` AS `country_name`, `gdp` AS `gdp` FROM `Sample_Database`.`sample_country_gdp` WHERE `year` = '2025' AND `country` = '中国' LIMIT 1000","tables":["sample_country_gdp"],"chart-type":"table"}
